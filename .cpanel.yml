---
deployment:
  tasks:
    - export DEPLOYPATH=/home/auwcnmer/yutu-studio
    # Deploy Django project files (src layout)
    - /bin/cp -R src $DEPLOYPATH
    - /bin/cp -R templates $DEPLOYPATH
    - /bin/cp -R static $DEPLOYPATH
    - /bin/cp passenger_wsgi.py $DEPLOYPATH
    - /bin/cp .htaccess $DEPLOYPATH
    - /bin/cp requirements.txt $DEPLOYPATH
    - /bin/cp send-email.php $DEPLOYPATH
    # Create media directory if it doesn't exist
    - /bin/mkdir -p $DEPLOYPATH/media
    # Run migrations and collect static files (requires SSH access)
    # - cd $DEPLOYPATH/src && python manage.py migrate
    # - cd $DEPLOYPATH/src && python manage.py collectstatic --noinput